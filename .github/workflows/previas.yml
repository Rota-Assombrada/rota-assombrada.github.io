name: Prévias de link dos condomínios

on:
  schedule:
    - cron: '17 * * * *'   # de hora em hora
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['scripts/gerar-previas.mjs', 'scripts/capa-modelo.html', '.github/workflows/previas.yml']

permissions:
  contents: write
  pages: write

concurrency:
  group: previas
  cancel-in-progress: false

jobs:
  gerar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Gerar páginas de prévia
        run: node scripts/gerar-previas.mjs
      - name: Publicar se mudou
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git add c
          if git diff --cached --quiet; then echo "Nada mudou."; exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Atualiza prévias de link dos condomínios"
          git push
          gh api -X POST "repos/${{ github.repository }}/pages/builds" || echo "Pages vai publicar no próximo build."
