<!doctype html><html><head><meta charset="utf-8">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Creepster&family=Nunito:wght@800;900&display=swap">
<style>
html,body{margin:0;width:1200px;height:630px;overflow:hidden}
body{background:radial-gradient(120% 90% at 50% 115%,#3a1d5e 0%,#15102a 50%,#0d0a16 100%);font-family:Nunito,sans-serif;position:relative}
.lua{position:absolute;right:36px;top:22px;width:130px;height:130px;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffbe6,#fff3c4 55%,#e9d58b);box-shadow:0 0 60px 20px rgba(255,243,196,.35)}
.est{position:absolute;inset:0;background-image:radial-gradient(2px 2px at 12% 18%,#fff 60%,transparent 61%),radial-gradient(1.5px 1.5px at 28% 8%,#fff 60%,transparent 61%),radial-gradient(2px 2px at 41% 24%,#ffe9b0 60%,transparent 61%),radial-gradient(1.5px 1.5px at 57% 12%,#fff 60%,transparent 61%),radial-gradient(2px 2px at 69% 40%,#fff 60%,transparent 61%),radial-gradient(1.5px 1.5px at 5% 60%,#fff 60%,transparent 61%),radial-gradient(1.5px 1.5px at 88% 70%,#fff 60%,transparent 61%)}
.nevoa{position:absolute;left:-10%;right:-10%;bottom:-40px;height:200px;filter:blur(30px);background:radial-gradient(50% 60% at 25% 70%,rgba(160,120,220,.45),transparent 70%),radial-gradient(45% 60% at 75% 75%,rgba(120,80,200,.4),transparent 70%)}
.bat{position:absolute;width:60px;filter:drop-shadow(0 0 8px rgba(214,190,255,.8))}
.g{position:absolute;filter:drop-shadow(0 0 18px rgba(255,255,255,.45));opacity:.9}
.drac{position:absolute;left:70px;bottom:40px;width:300px;filter:drop-shadow(0 0 30px rgba(155,107,255,.6))}
.abo{position:absolute;filter:drop-shadow(0 0 30px rgba(255,138,31,.6))}
.txt{position:absolute;left:400px;right:120px;top:0;bottom:0;display:flex;align-items:center}
h1{font-family:Creepster,Impact,sans-serif;font-weight:400;margin:0;font-size:84px;line-height:.95;color:#f7f1ff;text-shadow:0 0 30px rgba(255,138,31,.6),0 4px 0 #4a1d00;letter-spacing:.02em}
h1 span{color:#ff8a1f}
p{margin:16px 0 0;color:#e7defa;font-size:32px;font-weight:900;line-height:1.2}
.nome{margin:14px 0 0;color:#fff;font-size:46px;font-weight:900;line-height:1.08;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;text-shadow:0 2px 0 #2a1846}
.nome.longo{font-size:38px}
.chip{display:inline-block;margin-top:26px;padding:12px 26px;border-radius:999px;background:linear-gradient(180deg,#ffa348,#ff8a1f 55%,#ff6a00);color:#1c0b00;font-weight:900;font-size:30px;box-shadow:0 6px 0 #b84a00}
.nome:empty,p:empty{display:none}
.botoes{display:flex;flex-direction:column;align-items:flex-start;gap:18px;margin-top:24px}
.botoes .chip{margin-top:0}
.alerta{display:inline-flex;align-items:center;gap:12px;padding:10px 26px 10px 18px;border-radius:999px;background:linear-gradient(180deg,#ff4d5e,#e8102b 60%,#b80018);color:#fff;font-weight:900;font-size:28px;letter-spacing:.04em;border:3px solid #fff;box-shadow:0 0 0 4px rgba(232,16,43,.45),0 0 34px 6px rgba(255,40,60,.65),0 6px 0 #7a0010;text-shadow:0 2px 0 rgba(0,0,0,.35)}
.alerta svg{width:34px;height:34px;flex:none}
.selo{display:inline-block;margin-bottom:14px;padding:8px 22px;border-radius:12px;background:#8df06a;color:#06200a;font:900 34px Nunito,sans-serif;letter-spacing:.12em;transform:rotate(-4deg);box-shadow:0 6px 0 #3f8f2a}</style></head><body><div class="est"></div><div class="lua"></div><div class="nevoa"></div>
<div class="bat" style="left:420px;top:70px"><svg viewBox="0 0 34 18" fill="#7b5cc0"><path d="M0 10C3 2 8 2 12 8c1-4 4-4 5 0 1-4 4-4 5 0 4-6 9-6 12 2-6-1-10 1-14 6-1-3-5-3-6 0-4-5-8-7-14-6z"/></svg></div><div class="bat" style="left:760px;top:120px;width:44px"><svg viewBox="0 0 34 18" fill="#7b5cc0"><path d="M0 10C3 2 8 2 12 8c1-4 4-4 5 0 1-4 4-4 5 0 4-6 9-6 12 2-6-1-10 1-14 6-1-3-5-3-6 0-4-5-8-7-14-6z"/></svg></div>

<div class="txt"><div>{{SELO}}<h1>Rota <span>Assombrada</span></h1><div class="nome {{CLASSE_NOME}}">{{NOME}}</div><p>{{SUB}}</p><div class="botoes"><div class="chip">{{CHIP}}</div>{{ALERTA}}</div></div></div>
</body></html>
