<style>:root{--fg:#f7f1ff;--fg2:#cdc2e6;--abobora:#ff8a1f;--abobora2:#ff6a00;--f-titulo:'Creepster','Impact','Arial Black',sans-serif}
html,body{margin:0;background:#0d0a16;color:#f7f1ff;font-family:Nunito,'Segoe UI',system-ui,sans-serif}
@keyframes flutuar{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-16px) rotate(3deg)}}
/* ---------- tela de abertura (some sozinha quando o app fica pronto) ---------- */
.splash{position:fixed;inset:0;z-index:5000;overflow:hidden;display:flex;align-items:center;justify-content:center;
  background:radial-gradient(120% 80% at 50% 110%,#3a1d5e 0%,#15102a 55%,#0d0a16 100%);transition:opacity .45s ease,visibility .45s}
.splash.saindo{opacity:0;visibility:hidden}
.splash-lua{position:absolute;top:7%;right:9%;width:min(26vw,150px);aspect-ratio:1;border-radius:50%;background:radial-gradient(circle at 35% 35%,#fffbe6,#fff3c4 55%,#e9d58b);box-shadow:0 0 70px 24px rgba(255,243,196,.3);animation:splash-lua 4s ease-in-out infinite}
.splash-centro{position:relative;display:flex;flex-direction:column;align-items:center;text-align:center;padding:0 24px}
.splash-drac .dracula{width:min(42vw,190px);animation:splash-drac .8s cubic-bezier(.34,1.56,.64,1) both,flutuar 4s ease-in-out .8s infinite}
.splash-titulo{font-family:var(--f-titulo);font-size:clamp(2.4rem,11vw,4rem);line-height:1;margin-top:8px;color:var(--fg);text-shadow:0 0 24px rgba(255,138,31,.55),0 3px 0 #4a1d00;animation:splash-sobe .5s .1s ease-out both}
.splash-titulo span{color:var(--abobora)}
.splash-barra{width:min(60vw,240px);height:8px;border-radius:999px;background:rgba(255,255,255,.1);overflow:hidden;margin-top:18px}
.splash-barra i{display:block;height:100%;width:40%;border-radius:999px;background:linear-gradient(90deg,var(--abobora),var(--abobora2));animation:splash-barra 1.3s ease-in-out infinite}
.splash-txt{margin:12px 0 0;color:var(--fg2);font-weight:800;min-height:1.5em}
.splash-bat{position:absolute;width:52px;filter:drop-shadow(0 0 8px rgba(214,190,255,.8));animation:splash-voo 5s linear infinite}
.splash-bat svg{animation:splash-asa .25s ease-in-out infinite alternate;transform-origin:center}
.splash-bat.b1{top:18%;animation-delay:-1s}.splash-bat.b2{top:30%;width:36px;animation-duration:6.5s;animation-delay:-3.5s}.splash-bat.b3{top:62%;width:42px;animation-duration:7s;animation-delay:-5s}
.splash-fantasma{position:absolute;width:64px;opacity:.85;filter:drop-shadow(0 0 16px rgba(255,255,255,.45));animation:splash-fantasma 3.2s ease-in-out infinite}
.splash-fantasma.f1{left:7%;bottom:22%}.splash-fantasma.f2{right:10%;bottom:15%;width:48px;animation-delay:-1.4s}
.splash-abo{position:absolute;bottom:5%;left:50%;width:min(24vw,110px);transform:translateX(-50%);filter:drop-shadow(0 0 24px rgba(255,138,31,.6));animation:splash-abo 1.8s ease-in-out infinite}
@keyframes splash-drac{0%{transform:translateY(40px) scale(.6);opacity:0}100%{transform:none;opacity:1}}
@keyframes splash-sobe{from{transform:translateY(14px);opacity:0}to{transform:none;opacity:1}}
@keyframes splash-barra{0%{transform:translateX(-110%)}100%{transform:translateX(260%)}}
@keyframes splash-voo{0%{left:-15%;transform:translateY(0)}25%{transform:translateY(-18px)}50%{transform:translateY(10px)}75%{transform:translateY(-12px)}100%{left:110%;transform:translateY(0)}}
@keyframes splash-asa{from{transform:scaleY(1)}to{transform:scaleY(.45)}}
@keyframes splash-fantasma{0%,100%{transform:translateY(0) rotate(-4deg)}50%{transform:translateY(-16px) rotate(4deg)}}
@keyframes splash-abo{0%,100%{transform:translateX(-50%) rotate(-5deg)}50%{transform:translateX(-50%) rotate(5deg) scale(1.05)}}
@keyframes splash-lua{0%,100%{box-shadow:0 0 70px 24px rgba(255,243,196,.3)}50%{box-shadow:0 0 90px 34px rgba(255,243,196,.42)}}
@media (prefers-reduced-motion:reduce){.splash *{animation:none!important}.splash-bat.b1{left:20%}.splash-bat.b2{left:70%}.splash-bat.b3{left:12%}}

.splash-fallback{position:fixed;left:0;right:0;bottom:24px;z-index:5001;text-align:center;font-weight:800;opacity:0;animation:aparece .3s 4s forwards}
.splash-fallback a{color:#ff8a1f}
@keyframes aparece{to{opacity:1}}</style>
